<!-- templates/publicacion_editar.html -->
{% extends "base.html" %}

{% block titulo %}Editar publicación{% endblock titulo %}

{% block contenido %}
  <h1>Editar publicación</h1>
  <form action="" method="post" class="formulario">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="boton">Actualizar</button>
    <a href="{{ publicacion.get_absolute_url }}">Cancelar</a>
  </form>
{% endblock contenido %}
